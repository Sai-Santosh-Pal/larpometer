<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Much Larp?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Geist+Pixel&family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-black">
    <div class="container-main h-[100vh] flex flex-col items-center justify-center w-[100vw]">
        <p class="text-5xl text-white">Larpometer</p>
        <p class="text-xl italic font-thin text-stone-400 mb-10">calculate ur larp <3</p>
        <div class="md:flex-row flex text-white border-[0.5px] border-stone-800 md:w-[80%]">
            <div class="right py-10 my-2 gap-2 border-r-1 border-stone-800 flex flex-col px-5 w-[50%]">
                <p class="italic font-bold">Enter the following details:</p>
                <form id="details" class="mt-3 gap-3 flex flex-col">
                    <div>
                        <label for="name">your name</label><br>
                        <input
                            type="text"
                            name="name"
                            id="name"
                            required
                            class="border-[0.2px] py-1 px-3 border-stone-600 outline-none rounded-sm w-[100%]"
                        >
                    </div>

                    <div>
                        <label for="larp-name">your "larp" name</label><br>
                        <input
                            type="text"
                            name="larpName"
                            id="larp-name"
                            required
                            class="border-[0.2px] py-1 px-3 border-stone-600 outline-none rounded-sm w-[100%]"
                        >
                    </div>

                    <div>
                        <label for="larp">your larp</label><br>
                        <textarea
                            name="larp"
                            id="larp"
                            required
                            class="border-[0.2px] py-1 px-3 border-stone-600 outline-none rounded-sm w-[100%]"
                        ></textarea>
                    </div>

                    <button
                        type="submit"
                        id="btn"
                        class="cursor-pointer px-5 py-2 mt-4 hover:outline-1 outline-white outline-offset-[2px] bg-white text-black font-bold"
                    >
                        get your larp score
                    </button>
                </form>
            </div>
            <div class="left w-[50%] flex flex-col justify-center items-center">
                <div class="percentage border-[0.1px] boder-gray-900 h-[150px] bg-gray-800 w-[150px] rounded-[1000px]">
                </div>
                <div class="text mt-10 bold w-[60%]">
                    <p class="font-bold">Feedback</p>
                    <p>loading...</p>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </div>
    <style>
        *{
            font-family: 'Geist Pixel';
            transition: all 0.8s ease-in;
        }
        .percentage {
            position: relative;
            background: conic-gradient(#4e4e4e 0% 0%, #000 0% 100%);
        }
        .
    </style>
</body>
</html>
